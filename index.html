<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Bark Store</title>
    <link rel="icon" type="image/svg+xml" href="./img/galaxy-g-favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Gugi&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>
    <canvas id="starfield"></canvas>

    <div class="notice-banner" role="note" aria-label="Trading policy">REMINDER: Trading or reselling GALAXY dinos is prohibited!</div>

    <main class="container">
        <header class="search-filter-section">
            <h1 class="logo">GALAXY</h1>
            <div class="search-container" role="search">
                <input type="text" id="searchInput" placeholder="Search the GALAXY..." aria-label="Search creatures and items">
            </div>

            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="dinosaur">Dinosaurs</button>
                <button class="filter-btn" data-filter="saddle">Saddles</button>
                <button class="filter-btn" data-filter="weapon">Weapons</button>
                <button class="filter-btn" data-filter="tool">Tools</button>
            </div>

            <button class="cart-toggle" id="cartToggle" type="button" aria-label="Open cart">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span class="cart-count empty" id="cartCount">0</span>
            </button>
        </header>

        <section class="cards-grid" id="cardsContainer" aria-live="polite"></section>
    </main>

    <script src="./assets/js/main.js" defer></script>
</body>
</html>
